  <polygon points="222,80 228,80 225,73" fill="#172B3A"/>
  <!-- Ruler -->
  <rect x="240" y="75" width="16" height="65" rx="3" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5"/>
  <line x1="240" y1="85" x2="246" y2="85" stroke="#CA8A04" stroke-width="1.5"/>
  <line x1="240" y1="95" x2="246" y2="95" stroke="#CA8A04" stroke-width="1.5"/>
  <line x1="240" y1="105" x2="246" y2="105" stroke="#CA8A04" stroke-width="1.5"/>
  <line x1="240" y1="115" x2="246" y2="115" stroke="#CA8A04" stroke-width="1.5"/>
  <!-- Eraser -->
  <rect x="265" y="125" width="22" height="15" rx="3" fill="#EC4899"/>
  <rect x="276" y="125" width="11" height="15" rx="2" fill="#3B82F6"/>
  <!-- Joyful Kid receiving supplies -->
  <circle cx="330" cy="110" r="26" fill="#FCD34D"/>
  <path d="M310 105 C310 82 350 82 350 105 C340 92 320 92 310 105 Z" fill="#172B3A"/>
  <circle cx="323" cy="110" r="2.5" fill="#172B3A"/>
  <circle cx="337" cy="110" r="2.5" fill="#172B3A"/>
  <path d="M326 117 Q330 122 334 117" stroke="#172B3A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M305 145 C305 130 355 130 355 145 L355 190 L305 190 Z" fill="#F97316"/>
  <!-- Badge -->
  <rect x="20" y="16" width="160" height="26" rx="13" fill="#FFFFFF" stroke="#C5E3FB"/>
  <text x="32" y="33" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1688E8">✏️ Essential School Supplies</text>
