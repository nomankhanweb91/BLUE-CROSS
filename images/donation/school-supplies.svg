  <path d="M90 110 C90 90 130 90 130 110" stroke="#0F75CD" stroke-width="4" fill="none"/>
  <!-- Stationery kit box -->
  <rect x="175" y="140" width="120" height="65" rx="8" fill="#FFFFFF" stroke="#C5E3FB" stroke-width="2"/>
  <rect x="180" y="148" width="110" height="18" rx="4" fill="#FEF3C7"/>
  <!-- Pencils, Pens, Ruler protruding -->
  <line x1="195" y1="140" x2="195" y2="85" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <polygon points="192,85 198,85 195,78" fill="#172B3A"/>
  <line x1="210" y1="140" x2="210" y2="90" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
